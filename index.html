<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Experience 2026</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <header>
        <h1>Tech Experience 2026</h1>
        <p>Inscreva-se nas oficinas técnicas do nosso evento!</p>
    </header>

    <main class="container">

        <section class="formulario">
            <h2>Formulário de Inscrição</h2>
            <p>Preencha seus dados para participar do evento.</p>
            <form action="processar.php" method="post" id="formulario">

                <div class="campo">
                    <label for="nome">Nome completo:</label>
                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        required
                        minlength="3"
                        placeholder="Digite seu nome completo">
                </div>

                <div class="campo">
                    <label for="email">E-mail:</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                        placeholder="exemplo@email.com">
                </div>

                <div class="campo">
                    <label for="experiencia">Nível de experiência:</label>

                    <select id="experiencia" name="experiencia" required>
                        <option value="">Selecione seu nível</option>
                        <option value="iniciante">Iniciante</option>
                        <option value="intermediario">Intermediário</option>
                        <option value="avancado">Avançado</option>
                    </select>
                </div>

                <fieldset class="campo">
                    <legend>Turno de preferência:</legend>

                    <label class="opcao">
                        <input
                            type="radio"
                            name="turno"
                            value="manha"
                            required>
                        Manhã
                    </label>

                    <label class="opcao">
                        <input
                            type="radio"
                            name="turno"
                            value="noite">
                        Noite
                    </label>
                </fieldset>

                <fieldset class="campo">
                    <legend>Oficinas de interesse:</legend>

                    <label class="opcao">
                        <input
                            type="checkbox"
                            name="oficinas[]"
                            value="html_css">
                        HTML e CSS
                    </label>

                    <label class="opcao">
                        <input
                            type="checkbox"
                            name="oficinas[]"
                            value="js_dom">
                        JavaScript e DOM
                    </label>

                    <label class="opcao">
                        <input
                            type="checkbox"
                            name="oficinas[]"
                            value="php_backend">
                        PHP e Backend
                    </label>

                    <span
                        id="erro-oficinas"
                        class="error-message"
                        aria-live="polite">
                    </span>
                </fieldset>

                <div class="campo">
                    <label for="mensagem">Mensagem / Motivação:</label>

                    <textarea
                        id="mensagem"
                        name="mensagem"
                        maxlength="200"
                        placeholder="Conte por que deseja participar..."></textarea>

                    <small id="contador">Restam 200 caracteres</small>
                </div>

                <button type="submit">Realizar inscrição</button>

            </form>
        </section>

    </main>

    <footer>
        <p>Tech Experience 2026 - Evento Acadêmico</p>
        <p>Desenvolvimento Web</p>
    </footer>

</body>
</html>
